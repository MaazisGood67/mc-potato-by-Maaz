name: Windows test release

on:
  push:
    tags:
      - "v*-test"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Test engine
        run: cargo test --release --manifest-path engine/Cargo.toml

      - name: Build Windows executable
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Publish test prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: MaazX Potato Edition ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          body: |
            Windows test build. This is an early prototype, not a final compatibility guarantee.

            Download `maazx.exe` and double-click it to run. Rust is not needed to run the prebuilt executable.

            Controls: WASD to move, mouse to look, Escape to quit.

            This build has a flat test world. Jumping and block placement/breaking are not implemented yet. Please report whether it opens on your PC and the FPS shown.
          files: engine/target/release/maazx.exe